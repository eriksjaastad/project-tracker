name: "PR: Run Test Suite"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Pinned explicitly rather than resolved from pyproject.toml, whose
      # `requires-python = ">=3.11"` would happily pick 3.14 — and 3.14 breaks
      # libsql, which is a core dependency here, not an optional extra.
      # .python-version says 3.13; this keeps CI honest about that.
      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --extra test --python 3.13

      # The visual tests self-skip without a dashboard on localhost:8000, and
      # the cr-sqlite tests self-skip without crsqlite.dylib, so a clean Linux
      # runner reports them as skips rather than failures.
      - name: Run tests
        run: uv run --python 3.13 python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/frontend/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
