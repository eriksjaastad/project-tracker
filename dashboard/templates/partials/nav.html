<!-- Navigation bar partial for Jinja pages -->
<nav class="navigation">
    <div class="navigation-container">
        <div class="navigation-brand">
            <a href="/dashboard" class="navigation-title">{{ nav_title }}</a>
        </div>
        <div class="navigation-links">
            {% for item in nav_items %}
                {% if item.children %}
                <div class="nav-group" tabindex="-1">
                    <a href="{{ item.href }}" class="nav-link {{ 'active' if item.active else '' }}">{{ item.label }}</a>
                    <span class="nav-caret" aria-hidden="true">▾</span>
                    <div class="nav-menu">
                        {% for child in item.children %}
                        <a href="{{ child.href }}" class="nav-menu-link {{ 'active' if child.active else '' }}">{{ child.label }}</a>
                        {% endfor %}
                    </div>
                </div>
                {% else %}
                <a href="{{ item.href }}" class="nav-link {{ 'active' if item.active else '' }}">{{ item.label }}</a>
                {% endif %}
            {% endfor %}
        </div>
    </div>
</nav>
