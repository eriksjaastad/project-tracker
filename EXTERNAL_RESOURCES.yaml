# API KEY MANAGEMENT PATTERN
api_key_pattern:
  rule: "Each project manages its own API keys - NEVER share across projects"
  format: "{project-name}-{service} → {project}/.env"
  template: "{PROJECTS_ROOT}/.env.project-template"
  naming_rule: "Provider API keys use canonical provider names inside each project scope; project prefixes are legacy."
  examples:
    - "DEEPSEEK_API_KEY → _archive/project-scaffolding/.env or Doppler project project-scaffolding (archived)"
    - "OPENAI_API_KEY → cortana-personal-ai/.env or cortana-personal-ai Doppler config"
    - "OPENAI_API_KEY → trading-copilot Doppler config"
  why:
    - "Cost attribution (which project spent what?)"
    - "Failure isolation (one project's rate limit doesn't affect others)"
    - "Security isolation (compromise one → others safe)"
    - "Clear ownership (each project pays for itself)"

# API KEY INVENTORY AND NORMALIZATION AUDIT
# First pass added 2026-04-30 after a live DeepSeek key usage investigation.
# Rules:
# - Never record secret values here. Record names, owners, storage location, and consumers only.
# - Doppler is preferred for active projects. Local .env keys are legacy/local-only and should be reviewed.
# - DOPPLER_TOKEN must not be hardcoded in repos. Use Doppler CLI auth/keychain for local machines;
#   only deployment-scoped service tokens may exist, and only in the deployment platform.
# - Standard AI provider key names:
#   ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, GOOGLE_API_KEY, OPENAI_API_KEY, XAI_API_KEY.
