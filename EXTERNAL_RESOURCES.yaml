  purpose: "Track external services and costs across all projects"
  last_updated: "2026-09-05"
  why_exists: "When you get a bill or notification, you need to know which project uses that service"

# MARKET DATA POLICY
# Exchanges (NYSE, Nasdaq, CME) charge "professional subscribers" 10-30× the non-professional rate.
# Business entities, LLCs, and anyone deriving trading revenue are classified as professional.
# Always sign up for market data subscriptions (Tradier, Alpaca, Polygon, Databento, IBKR, etc.)
# under the PERSONAL account (spudlogic, spudlogic@gmail.com) to retain non-pro status.
# Re-evaluate carefully if/when SIL incorporates — incorrect re-certification can be expensive.
market_data_policy:
  rule: "All market data subscriptions under spudlogic (personal) account, never under synthinsightlabs"
  reason: "Exchange 'professional subscriber' fees are 10-30× higher for entities"
  applies_to: ["Tradier", "Alpaca", "Polygon", "Databento", "IBKR", "TradingView", "any exchange-feed vendor"]

# ACCOUNT REGISTRY
# Two accounts: personal (spudlogic) and business (synthinsightlabs)
# When ready to formalize SIL as a business: new bank account → Stripe under SIL → migrate customer-facing services
accounts:
  spudlogic:
    type: personal
    email: "spudlogic@gmail.com"
    github: "eriksjaastad"
    notes: "Personal account. Most services default here (legacy). GitHub, personal bank."
  synthinsightlabs:
    type: business
    email: "admin@synthinsightlabs.com"
    domain: "synthinsightlabs.com"
    github: "10 GitHub Apps managed under synth-insight-labs Doppler (architect, manager, claude, ai-memory, hypocrisynow, muffinpanrecipes, tax-organizer, synthinsightlabs, tools, auxesis-coder)"
    bank: "confirm — not yet documented"
    llc: true  # Confirmed by Erik 2026-06-29: SIL is a real LLC.
    ein: "Obtained (confirmed 2026-06-29). Value stored in Doppler as SYNTH_INSIGHT_LABS_LLC_EIN (synth-insight-labs + auxesis configs); not inlined here per the no-secret-values policy."
    notes: "Real business entity (LLC + EIN). Also the company identity/infra hub — see the synth-insight-labs project entry below (GitHub App creds, Google OAuth, Resend, Bluesky, Paddle). Re-check market_data_policy now that SIL is incorporated: keep market-data subscriptions under the personal (spudlogic) account to avoid 'professional subscriber' fees."

# VENDORS WITH AN ACCOUNT ON BOTH IDENTITIES
# A vendor listed here has TWO separate accounts, one per identity. Logging in shows
# you ONE of them. A dashboard that says "free plan, no usage" is not proof that the
# vendor is not billing you — check the other identity, or probe the API key.
multi_account_vendors:
  firecrawl:
    accounts:
      spudlogic:
        email: "spudlogic@gmail.com"
        plan: "Free"
        api_key: "Doppler data-vault-factory + auxesis (same key)"
        history: >
          Was the paid Standard account Mar-May 2026 on REI Mastercard ...7084
          ($19 Mar 6, $51.47 Mar 17, $99 Apr 6, $99 May 6). Refunded +$99 on
          2026-05-07 and downgraded to free. Stripe receipts for this account
          did arrive at spudlogic@gmail.com (invoice series MW2CW9YV).
      synthinsightlabs:
        email: "admin@synthinsightlabs.com"
        plan: "Free as of 2026-09-05 (downgrade effective at period end 2026-09-06T03:55Z)"
        api_key: "Doppler hypocrisynow (dev + prd)"
        history: >
          The $99/mo Standard subscription that ran unnoticed. Charged to Visa ...9311
          on Apr 15 ($19), then $99 on May 6, Jun 7, Jul 6, Aug 6 2026 -- about $415.
          It NEVER sent a Stripe receipt to any inbox Erik reads, and logging in landed
          on the spudlogic account, which correctly showed "free plan, no usage". Found
          2026-09-05 by probing the API key: planCredits 100000 / maxConcurrency 50
          identifies Standard without needing a login. Total usage over its life was
          404 credits of 400,000 paid for.
    verify: >
      Confirm no $99 FIRECRAWL.DEV charge lands on Visa ...9311 on or after 2026-09-06.
      A downgrade takes effect at period end, so the API still reports Standard until
      then -- that is expected, not a failed cancellation. Do not mark this closed until
      the September statement is clean. (Precedent: the Vercel v0 subscription was
      refunded but never actually cancelled and leaked ~$133.)
    lesson: >
      When a charge exists but the vendor dashboard shows nothing, assume a second
      account before assuming a vendor billing bug.

